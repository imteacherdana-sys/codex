<!doctype html>
<html lang="ko" data-resolution="landscape" data-composition-variables='[{"id": "prompt", "type": "string", "label": "입력할 프롬프트", "default": "유튜브 롱폼 대본을 10분 분량으로 써줘. 주제는 모션그래픽 완전정복"}, {"id": "answer", "type": "string", "label": "답변 (줄바꿈으로 문단)", "default": "좋아요. 10분 대본은 이렇게 나눠볼게요.\n1. 훅 · 밋밋한 자막 한 줄 (0:00–0:30)\n2. 원리 네 가지 · 타이밍, 이징, 위계, 전환\n3. 정리와 다음 편 예고"}, {"id": "highlight", "type": "string", "label": "라임으로 강조할 문구", "default": "원리 네 가지"}]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Pretendard"; src: url("assets/fonts/Pretendard.woff2") format("woff2"); font-weight: 100 900; font-display: block; }
      @font-face { font-family: "Noto Color Emoji"; src: local("Noto Color Emoji"); }
      @font-face { font-family: "NanumPen"; src: url("assets/fonts/NanumPenScript-korean.woff2") format("woff2"); font-display: block; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #05060f; }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; font-family: "Pretendard", sans-serif; color: #f5f3ff; word-break: keep-all; }
      .ground { position: absolute; inset: 0; background: linear-gradient(#0b1026, #05060f); }
      .grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(124,58,237,.12) 1px, transparent 1px), linear-gradient(90deg, rgba(124,58,237,.12) 1px, transparent 1px); background-size: 40px 40px; -webkit-mask-image: radial-gradient(ellipse at 50% 50%, #000 20%, transparent 70%); mask-image: radial-gradient(ellipse at 50% 50%, #000 20%, transparent 70%); }

      .win { position: absolute; left: 240px; top: 100px; width: 1440px; height: 880px; border-radius: 26px; background: #20201f; box-shadow: 0 0 0 2px #424240, 0 40px 100px rgba(0,0,0,.55); overflow: hidden; }
      .bar { position: absolute; left: 0; right: 0; top: 0; height: 72px; display: flex; align-items: center; gap: 14px; padding: 0 32px; border-bottom: 1px solid #424240; }
      .bar b { font-size: 28px; font-weight: 700; color: #f8f8f4; }
      .bar i { width: 18px; height: 18px; border-radius: 5px; background: #d97757; display: block; }
      .bar small { margin-left: auto; font-size: 20px; color: #94948c; }
      .user { position: absolute; right: 64px; top: 120px; max-width: 900px; padding: 22px 30px; border-radius: 26px; background: #2f2f2c; font-size: 32px; line-height: 1.5; color: #f8f8f4; }
      .think { position: absolute; left: 64px; top: 270px; display: flex; align-items: center; gap: 16px; font-size: 28px; color: #94948c; }
      .think i { width: 18px; height: 18px; border-radius: 50%; background: #d97757; display: block; }
      .answer { position: absolute; left: 64px; top: 260px; width: 1200px; font-size: 32px; line-height: 1.7; color: #f8f8f4; }
      .answer p { margin-bottom: 10px; }
      .answer span { display: inline; }
      .hlw { position: relative; display: inline-block; isolation: isolate; }
      .mark { position: absolute; left: -6px; right: -6px; top: 4px; bottom: 2px; border-radius: 10px; z-index: -1; background: rgba(180,230,29,.26); box-shadow: inset 0 -6px 0 #b4e61d; transform-origin: left center; }
      .input { position: absolute; left: 120px; right: 120px; bottom: 40px; height: 118px; border-radius: 26px; background: #2a2a28; box-shadow: 0 0 0 1px #424240; display: flex; align-items: center; padding: 0 130px 0 40px; font-size: 32px; color: #f8f8f4; }
      .ph { position: absolute; left: 40px; color: #94948c; }
      .typed { white-space: pre; }
      .typed span { display: none; }
      .caret { display: inline-block; width: 3px; height: 38px; margin-left: 2px; background: #f8f8f4; vertical-align: -6px; }
      .send { position: absolute; right: 26px; top: 26px; width: 66px; height: 66px; border-radius: 14px; background: #d97757; color: #1c1c1b; display: grid; place-items: center; font-size: 34px; font-weight: 800; }
      .tag { position: absolute; left: 240px; top: 52px; font-size: 22px; color: #a5a3c7; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="chat-claude" data-start="0" data-duration="12" data-width="1920" data-height="1080">
      <div class="ground"></div>
      <div class="grid"></div>
      <div class="tag" id="chat-claude-tag">예시 화면 · 실제 시연은 화면 녹화로</div>
      <div class="win" id="chat-claude-win">
        <div class="bar"><i></i><b>Claude</b><small>새 대화</small></div>
        <div class="user" id="chat-claude-user"></div>
        <div class="think" id="chat-claude-think"><i id="chat-claude-dot"></i><span>생각하는 중…</span></div>
        <div class="answer" id="chat-claude-answer"></div>
        <div class="input"><span class="ph" id="chat-claude-ph">오늘 무엇을 도와드릴까요?</span><span class="typed" id="chat-claude-typed"></span><span class="caret" id="chat-claude-caret"></span><div class="send" id="chat-claude-send">↑</div></div>
      </div>

      <div id="chat-claude-drv" class="clip" data-start="0" data-duration="12" data-track-index="0" style="position:absolute;width:1px;height:1px;opacity:0;pointer-events:none"></div>
    </div>
    <script>
      (function () {
        window.__timelines = window.__timelines || {};
        const vars = (window.__hyperframes && window.__hyperframes.getVariables && window.__hyperframes.getVariables()) || {};
        const tl = gsap.timeline({ paused: true });

        const prompt = vars.prompt || "유튜브 롱폼 대본을 10분 분량으로 써줘. 주제는 모션그래픽 완전정복";
        const lines = (vars.answer || "좋아요. 10분 대본은 이렇게 나눠볼게요.\n1. 훅 · 밋밋한 자막 한 줄 (0:00–0:30)\n2. 원리 네 가지 · 타이밍, 이징, 위계, 전환\n3. 정리와 다음 편 예고").split("\n");
        const mark = vars.highlight || "원리 네 가지";
        const typed = document.getElementById("chat-claude-typed");
        const chars = Array.from(prompt).map(function (ch) { const s = document.createElement("span"); s.textContent = ch; typed.appendChild(s); return s; });
        document.getElementById("chat-claude-user").textContent = prompt;
        const ans = document.getElementById("chat-claude-answer");
        const words = [];
        let hl = null;
        function addWords(parent, text) {
          text.split(/(\s+)/).forEach(function (w) { if (!w) return; const s = document.createElement("span"); s.textContent = w; parent.appendChild(s); if (w.trim()) words.push(s); });
        }
        lines.forEach(function (line) {
          const p = document.createElement("p");
          const at = mark ? line.indexOf(mark) : -1;
          if (at > -1 && !hl) {
            addWords(p, line.slice(0, at));
            const wrap = document.createElement("span"); wrap.className = "hlw";
            hl = document.createElement("i"); hl.className = "mark"; wrap.appendChild(hl);
            addWords(wrap, mark); p.appendChild(wrap);
            addWords(p, line.slice(at + mark.length));
          } else addWords(p, line);
          ans.appendChild(p);
        });
        gsap.set(["#chat-claude-user", "#chat-claude-think"], { opacity: 0 });
        gsap.set(words, { opacity: 0 });
        if (hl) gsap.set(hl, { scaleX: 0 });
        tl.fromTo("#chat-claude-win", { opacity: 0, scale: 0.97 }, { opacity: 1, scale: 1, duration: 0.6, ease: "expo.out" }, 0.2);
        tl.fromTo("#chat-claude-tag", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 0.4);
        // 입력: 글자마다 0.05초
        tl.set("#chat-claude-ph", { opacity: 0 }, 1.0);
        chars.forEach(function (c, i) { tl.set(c, { display: "inline" }, 1.0 + i * 0.05); });
        const sendAt = 1.0 + chars.length * 0.05 + 0.45;
        tl.to("#chat-claude-send", { scale: 0.86, duration: 0.08, ease: "power2.in" }, sendAt);
        tl.to("#chat-claude-send", { scale: 1, duration: 0.3, ease: "back.out(2)" }, sendAt + 0.08);
        tl.set("#chat-claude-typed", { opacity: 0 }, sendAt + 0.1);
        tl.set("#chat-claude-ph", { opacity: 1 }, sendAt + 0.1);
        tl.fromTo("#chat-claude-user", { opacity: 0, y: 24, scale: 0.96 }, { opacity: 1, y: 0, scale: 1, duration: 0.45, ease: "expo.out" }, sendAt + 0.15);
        // 생각 중
        const th = sendAt + 0.6;
        tl.fromTo("#chat-claude-think", { opacity: 0 }, { opacity: 1, duration: 0.2 }, th);
        tl.fromTo("#chat-claude-dot", { scale: 0.7 }, { scale: 1.15, duration: 0.35, ease: "sine.inOut", yoyo: true, repeat: 3 }, th);
        tl.to("#chat-claude-think", { opacity: 0, duration: 0.15 }, th + 1.45);
        // 답변 스트리밍: 단어 묶음이 0.06초 간격
        const st = th + 1.6;
        words.forEach(function (w, i) { tl.fromTo(w, { opacity: 0 }, { opacity: 1, duration: 0.12, ease: "power1.out" }, st + i * 0.06); });
        if (hl) tl.to(hl, { scaleX: 1, duration: 0.45, ease: "expo.out" }, st + words.length * 0.06 + 0.3);

        window.__timelines["chat-claude"] = tl;
      })();
    </script>
  </body>
</html>
