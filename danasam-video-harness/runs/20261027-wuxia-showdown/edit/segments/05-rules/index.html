<!doctype html>
<html lang="ko" data-resolution="landscape">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1920, height=1080" />
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
@font-face { font-family: "Pretendard"; src: url("assets/fonts/PretendardVariable.woff2") format("woff2"); font-weight: 100 900; }
@font-face { font-family: "NanumPen"; src: url("assets/fonts/NanumPenScript-korean.woff2") format("woff2"); }
@font-face { font-family: "Noto Color Emoji"; src: local("Noto Color Emoji"); }
:root { --bg0: #0b1026; --bg1: #05060f; --grid: rgba(124,58,237,.12); --violet: #7c3aed; --purple: #4a33a6;
  --lime: #b4e61d; --coral: #ff6b5b; --fg: #f5f3ff; --mute: #a5a3c7; }
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--bg1); font-family: "Pretendard", sans-serif; color: var(--fg); word-break: keep-all; }
#root { position: relative; width: 1920px; height: 1080px; overflow: hidden; }
.ground { position: absolute; inset: 0; background: linear-gradient(var(--bg0), var(--bg1)); }
.gridbg { position: absolute; inset: -80px; background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 48px 48px; -webkit-mask-image: radial-gradient(ellipse at 50% 50%, #000 25%, transparent 72%); mask-image: radial-gradient(ellipse at 50% 50%, #000 25%, transparent 72%); }
.cam { position: absolute; inset: 0; transform-origin: 50% 50%; }
.cap { position: absolute; left: 160px; right: 160px; bottom: 64px; display: flex; justify-content: center; }
.cap span { display: inline-block; max-width: 1500px; padding: 14px 28px 16px; border-radius: 14px; background: rgba(5,6,15,.78);
  font-size: 42px; font-weight: 700; line-height: 1.38; text-align: center; letter-spacing: -0.01em; box-shadow: 0 10px 30px rgba(0,0,0,.35); }
.chip { display: inline-flex; align-items: center; gap: 10px; padding: 10px 18px; border-radius: 12px; font-weight: 800; font-size: 30px; }
.tag { position: absolute; left: 60px; top: 44px; font-size: 24px; font-weight: 700; color: var(--mute); letter-spacing: .04em; }
.ad { position: absolute; right: 60px; top: 44px; font-size: 22px; font-weight: 700; color: var(--mute); padding: 6px 12px; border: 2px solid rgba(165,163,199,.5); border-radius: 8px; }
.frame { position: absolute; border-radius: 22px; overflow: hidden; background: #000; box-shadow: 0 30px 80px rgba(0,0,0,.5), inset 0 0 0 2px rgba(255,255,255,.08); }
.frame video, .frame img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
.hl { background: linear-gradient(transparent 55%, rgba(180,230,29,.55) 55%); }

</style>
</head>
<body>
<div id="root" data-composition-id="s05" data-start="0" data-duration="12.14" data-width="1920" data-height="1080">
<div class="ground"></div><div class="gridbg" id="gridbg"></div>
<div class="cam" id="cam">
<div id="rt" style="position:absolute; left:0; right:0; top:150px; text-align:center; font-size:72px; font-weight:900;">공정 조건</div>
<div id="it0" style="position:absolute; left:460px; top:310px; display:flex; align-items:center; gap:28px; font-size:52px; font-weight:800;"><span style="width:64px; height:64px; border-radius:14px; background:var(--lime); color:#05060f; display:flex; align-items:center; justify-content:center; font-size:44px;">✓</span>6개 모델에 같은 문장</div>
<div id="it1" style="position:absolute; left:460px; top:430px; display:flex; align-items:center; gap:28px; font-size:52px; font-weight:800;"><span style="width:64px; height:64px; border-radius:14px; background:var(--lime); color:#05060f; display:flex; align-items:center; justify-content:center; font-size:44px;">✓</span>8초 · 16:9 · 같은 설정</div>
<div id="it2" style="position:absolute; left:460px; top:550px; display:flex; align-items:center; gap:28px; font-size:52px; font-weight:800;"><span style="width:64px; height:64px; border-radius:14px; background:var(--lime); color:#05060f; display:flex; align-items:center; justify-content:center; font-size:44px;">✓</span>다시 뽑기 없이 첫 결과만</div>
<div id="it3" style="position:absolute; left:460px; top:670px; display:flex; align-items:center; gap:28px; font-size:52px; font-weight:800;"><span style="width:64px; height:64px; border-radius:14px; background:var(--lime); color:#05060f; display:flex; align-items:center; justify-content:center; font-size:44px;">✓</span>가격은 마지막에 공개</div>
</div>
<div class="cap clip" id="cap0" data-start="0.40" data-duration="5.05" data-track-index="9"><span>조건은 똑같아요. 같은 문장, 8초, 다시 뽑기 없이 첫 결과만.</span></div>
<div class="cap clip" id="cap1" data-start="5.45" data-duration="6.18" data-track-index="9"><span>각 모델이 얼마 들었는지는 마지막에 보여드릴게요. 솔직히 그게 결론을 바꿔요.</span></div>
</div>
<script>
(function(){
const tl = gsap.timeline({ paused: true });
tl.fromTo("#gridbg", {x: 0, y: 0}, {x: -48, y: -24, duration: 12.14, ease: "none"}, 0);
tl.fromTo("#cam", {scale: 1.0}, {scale: 1.06, duration: 12.14, ease: "sine.inOut"}, 0);
tl.fromTo("#rt", {opacity: 0, y: -20}, {opacity: 1, y: 0, duration: 0.4}, 0.1);
tl.fromTo("#it0", {opacity: 0, x: -40}, {opacity: 1, x: 0, duration: 0.4, ease: "back.out(1.6)"}, 0.50);
tl.fromTo("#it1", {opacity: 0, x: -40}, {opacity: 1, x: 0, duration: 0.4, ease: "back.out(1.6)"}, 0.85);
tl.fromTo("#it2", {opacity: 0, x: -40}, {opacity: 1, x: 0, duration: 0.4, ease: "back.out(1.6)"}, 1.20);
tl.fromTo("#it3", {opacity: 0, x: -40}, {opacity: 1, x: 0, duration: 0.4, ease: "back.out(1.6)"}, 1.55);
tl.fromTo("#cap0 span", {opacity: 0, y: 14}, {opacity: 1, y: 0, duration: 0.25, ease: "power2.out"}, 0.40);
tl.fromTo("#cap1 span", {opacity: 0, y: 14}, {opacity: 1, y: 0, duration: 0.25, ease: "power2.out"}, 5.45);
window.__timelines = window.__timelines || {};
window.__timelines["s05"] = tl;
})();
</script>
</body>
</html>
